name: Publish Pipecat integration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-pipecat-oruk
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install framework and build dependencies
        run: python -m pip install ".[agent,test,local]" "build>=1,<2" "twine>=6,<8"
      - name: Build reviewed version
        run: |
          python -c "import tomllib; assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == '0.1.0rc2'"
          python -m build
          python -m twine check --strict dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import importlib.metadata, pipecat_oruk; from pipecat_oruk.local import OrukeetSTTService; assert pipecat_oruk.__version__ == importlib.metadata.version('pipecat-oruk') == '0.1.0rc2'"
          python -m pytest -q tests
          python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-pipecat-package
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pipecat-oruk/0.1.0rc2/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-pipecat-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
  registry:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify a fresh registry installation
        run: |
          python -m pip install 'pipecat-oruk[agent,test,local]==0.1.0rc2'
          python -m pip check
          python -c "import importlib.metadata, pipecat_oruk; from pipecat_oruk.local import OrukeetSTTService; assert pipecat_oruk.__version__ == importlib.metadata.version('pipecat-oruk') == '0.1.0rc2'"
          python -m pytest -q tests
